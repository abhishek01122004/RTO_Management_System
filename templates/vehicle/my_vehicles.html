<span class="badge {% if vehicle.status == 'ACTIVE' %}bg-success{% else %}bg-danger{% endif %}">
    {% if vehicle.status == 'ACTIVE' %}Active{% else %}Inactive{% endif %}
</span>
<small class="{% if vehicle.status == 'ACTIVE' %}text-success{% else %}text-danger{% endif %}">
    {% if vehicle.status == 'ACTIVE' %}Valid till {{ vehicle.expiry_date|date:"d M Y" }}{% else %}Expired{% endif %}
</small>
