{% extends 'base.html' %}

{% block title %}Test Email Configuration{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Test Email Configuration</h4>
                </div>
                <div class="card-body">
                    <p>Click the button below to send a test email to your registered email address ({{ request.user.email }}).</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-primary">Send Test Email</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
